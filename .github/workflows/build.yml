name: Build ImmortalWrt for Netis NX32U

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Где собирать?'
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - self-hosted
          - ubuntu-22.04
      force_clean:
        description: 'Очистить build_dir/staging_dir/ccache/tmp?'
        type: boolean
        default: false
      wipe_source:
        description: 'Удалить openwrt и клонировать заново?'
        type: boolean
        default: false
      skip_update:
        description: 'Пропустить git pull?'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean Cache (if requested)
        if: ${{ inputs.force_clean }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/openwrt/build_dir" 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/openwrt/staging_dir" 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/openwrt/.ccache" 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/openwrt/tmp" 2>/dev/null || true
          echo "OK: cache cleaned"

      - name: Wipe Source (if requested)
        if: ${{ inputs.wipe_source }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/openwrt" 2>/dev/null || true
          echo "OK: openwrt removed"

      - name: Install Dependencies
        run: |
          MISSING=""
          for pkg in build-essential clang flex bison g++ gawk gcc-multilib \
                     g++-multilib gettext git libncurses-dev libssl-dev \
                     python3-setuptools python3-dev swig rsync unzip \
                     zlib1g-dev file wget ccache; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            sudo apt-get update
            sudo apt-get -y install $MISSING
          else
            echo "OK: all deps installed"
          fi

      - name: Clone or Update Source
        run: |
          cd "$GITHUB_WORKSPACE"
          DL_CACHE="$RUNNER_WORKSPACE/dl-cache"
          mkdir -p "$DL_CACHE"
          echo "DL_CACHE=$DL_CACHE" >> $GITHUB_ENV

          if [ -d "openwrt" ] && [ ! -f "openwrt/scripts/feeds" ]; then
            echo "openwrt incomplete, removing"
            rm -rf openwrt
          fi

          if [ ! -d "openwrt" ]; then
            echo "cloning quytttb fork"
            git clone -b main https://github.com/quytttb/immortalwrt-mt798x-rebase.git openwrt
          elif [ "${{ inputs.skip_update }}" == "true" ]; then
            echo "skip_update=true"
          else
            cd openwrt
            git checkout -- . 2>/dev/null || true
            git clean -fd feeds/ package/ toolchain/ target/ 2>/dev/null || true
            git pull --rebase || echo "git pull failed, continuing"
            cd "$GITHUB_WORKSPACE"
          fi

          if [ -d "openwrt/dl" ] && [ ! -L "openwrt/dl" ]; then
            cp -rn openwrt/dl/. "$DL_CACHE/" 2>/dev/null || true
            rm -rf openwrt/dl
          fi
          ln -sfn "$DL_CACHE" openwrt/dl

          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Проверка/инжект профиля NX32U
      # ============================================================
      - name: Inject NX32U Profile
        run: |
          cd openwrt
          FILOGIC="target/linux/mediatek/image/filogic.mk"
          DTS_DIR="target/linux/mediatek/dts"
          DTS_FILE="$DTS_DIR/mt7981b-netis-nx32u.dts"

          echo "=== check for netis_nx32u profile ==="
          if grep -q "Device/netis_nx32u" "$FILOGIC"; then
            echo "OK: netis_nx32u profile already present"
            awk '/^define Device\/netis_nx32u$/,/^TARGET_DEVICES/' "$FILOGIC"
            exit 0
          fi

          echo "WARN: netis_nx32u profile missing, injecting"

          echo "=== download DTS ==="
          mkdir -p "$DTS_DIR"
          DTS_OK=0
          for url in \
            "https://raw.githubusercontent.com/openwrt/openwrt/main/target/linux/mediatek/dts/mt7981b-netis-nx32u.dts" \
            "https://raw.githubusercontent.com/openwrt/openwrt/master/target/linux/mediatek/dts/mt7981b-netis-nx32u.dts" \
            "https://raw.githubusercontent.com/openwrt/openwrt/openwrt-24.10/target/linux/mediatek/dts/mt7981b-netis-nx32u.dts"; do
            echo "try: $url"
            if curl -fsSL -o "$DTS_FILE" "$url" && [ -s "$DTS_FILE" ]; then
              echo "OK: DTS downloaded ($(wc -l < $DTS_FILE) lines)"
              DTS_OK=1
              break
            fi
          done

          if [ "$DTS_OK" != "1" ]; then
            echo "ERROR: failed to download DTS from all sources"
            exit 1
          fi

          echo "=== append profile ==="
          cat >> "$FILOGIC" << 'EOF'

define Device/netis_nx32u
  DEVICE_VENDOR := netis
  DEVICE_MODEL := NX32U
  DEVICE_DTS := mt7981b-netis-nx32u
  DEVICE_DTS_DIR := ../dts
  UBINIZE_OPTS := -E 5
  BLOCKSIZE := 128k
  PAGESIZE := 2048
  KERNEL_IN_UBI := 1
  UBOOTENV_IN_UBI := 1
  IMAGES := sysupgrade.itb
  KERNEL_INITRAMFS_SUFFIX := -recovery.itb
  KERNEL := kernel-bin | gzip
  KERNEL_INITRAMFS := kernel-bin | lzma | \
        fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb with-initrd | pad-to 64k
  IMAGE/sysupgrade.itb := append-kernel | \
        fit gzip $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb external-static-with-rootfs | \
        append-metadata
  DEVICE_PACKAGES := kmod-mt_wifi kmod-usb3 kmod-usb-ledtrig-usbport automount
  ARTIFACTS := preloader.bin bl31-uboot.fip
  ARTIFACT/preloader.bin := mt7981-bl2 spim-nand-ddr3
  ARTIFACT/bl31-uboot.fip := mt7981-bl31-uboot netis_nx32u
endef
TARGET_DEVICES += netis_nx32u
EOF

          echo "=== verify ==="
          awk '/^define Device\/netis_nx32u$/,/^TARGET_DEVICES/' "$FILOGIC"

      # ============================================================
      # Проверка U-Boot для NX32U
      # ============================================================
      - name: Verify U-Boot for NX32U
        run: |
          cd openwrt
          UBOOT_MK="package/boot/uboot-mediatek/Makefile"

          echo "=== check U-Boot/mt7981_netis_nx32u ==="
          if grep -q "U-Boot/mt7981_netis_nx32u" "$UBOOT_MK"; then
            echo "OK: U-Boot/mt7981_netis_nx32u present"
          else
            echo "ERROR: U-Boot/mt7981_netis_nx32u MISSING in quytttb"
            echo "=== existing netis entries ==="
            grep -n "netis" "$UBOOT_MK" || echo "нет netis вообще"
            echo ""
            echo "=== существующие U-Boot mt7981_* ==="
            grep -n "^define U-Boot/mt7981_" "$UBOOT_MK" || echo "нет mt7981 вообще"
            echo ""
            echo "УБЕДИСЬ что в этом файле есть U-Boot/mt7981_netis_nx32u, иначе будет ошибка"
            # не падаем, продолжаем — проверим реально на этапе сборки
          fi

      # ============================================================
      # Патч mtwifi-cfg-ucode — убираем зависимость iwinfo-ucode
      # ============================================================
      - name: Patch mtwifi-cfg-ucode (remove iwinfo-ucode dep)
        run: |
          cd openwrt
          MK="package/mtk/applications/mtwifi-cfg-ucode/Makefile"
          if [ ! -f "$MK" ]; then
            echo "WARN: $MK not found, skipping"
            exit 0
          fi

          echo "=== BEFORE ==="
          grep "DEPENDS" "$MK" | head -3

          # убираем +iwinfo-ucode из DEPENDS
          sed -i 's/+iwinfo-ucode//g' "$MK"

          echo "=== AFTER ==="
          grep "DEPENDS" "$MK" | head -3
          echo "OK: патч применён"

      # ============================================================
      # Патч libgcc для APK
      # ============================================================
      - name: Fix libgcc Version for APK
        run: |
          cd openwrt
          TARGET_MK="feeds/base/libs/toolchain/Makefile"
          if [ ! -f "$TARGET_MK" ]; then
            echo "toolchain Makefile not found, skipping"
            exit 0
          fi
          if grep -q 'PKG_VERSION.*GCC_VERSION' "$TARGET_MK"; then
            sed -i 's|PKG_VERSION:=\$(GCC_VERSION)|PKG_VERSION:=$(if $(GCC_VERSION),$(GCC_VERSION),14.3.0)|' "$TARGET_MK"
            echo "libgcc patch applied"
          else
            echo "PKG_VERSION already correct"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v4
        if: inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/.ccache
          key: ccache-nx32u-${{ github.sha }}
          restore-keys: ccache-nx32u-

      - name: Restore build_dir
        uses: actions/cache/restore@v4
        if: inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/build_dir
          key: build-nx32u-${{ github.sha }}
          restore-keys: build-nx32u-

      - name: Restore staging_dir
        uses: actions/cache/restore@v4
        if: inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/staging_dir
          key: staging-nx32u-${{ github.sha }}
          restore-keys: staging-nx32u-

      - name: Restore dl-cache
        uses: actions/cache/restore@v4
        if: inputs.runner_type == 'ubuntu-22.04'
        with:
          path: ${{ runner.workspace }}/dl-cache
          key: dl-nx32u-${{ github.sha }}
          restore-keys: dl-nx32u-

      - name: Apply Config
        run: |
          cp "$GITHUB_WORKSPACE/config/nx32u.config" openwrt/.config
          cd openwrt
          make defconfig

          echo "=== check critical packages ==="
          for pkg in kmod-mt_wifi kmod-conninfra kmod-warp kmod-mediatek_hnat \
                     wifi-dats mtwifi-cfg mtwifi-cfg-ucode luci-app-mtwifi-cfg \
                     kmod-zram kmod-lib-lz4 kmod-usb3 automount; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config && echo "OK: $pkg" || echo "MISSING: $pkg"
          done

          echo "=== check Kconfig conninfra ==="
          grep -E "CONFIG_MTK_CONNINFRA_APSOC" .config || echo "MISSING: MTK_CONNINFRA_APSOC"

          echo "=== check device profile ==="
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE_netis_nx32u=y" .config || {
            echo "ERROR: netis_nx32u profile not activated"
            exit 1
          }

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          rm -rf tmp
          echo "=== starting build ==="
          make -j$(nproc) || make -j1 V=s

          echo "=== check result ==="
          ls -lh bin/targets/mediatek/filogic/*.itb bin/targets/mediatek/filogic/*.bin bin/targets/mediatek/filogic/*.fip 2>/dev/null || {
            echo "ERROR: no images found"
            exit 1
          }

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always() && inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/.ccache
          key: ccache-nx32u-${{ github.sha }}

      - name: Save build_dir
        uses: actions/cache/save@v4
        if: always() && inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/build_dir
          key: build-nx32u-${{ github.sha }}

      - name: Save staging_dir
        uses: actions/cache/save@v4
        if: always() && inputs.runner_type == 'ubuntu-22.04'
        with:
          path: openwrt/staging_dir
          key: staging-nx32u-${{ github.sha }}

      - name: Save dl-cache
        uses: actions/cache/save@v4
        if: always() && inputs.runner_type == 'ubuntu-22.04'
        with:
          path: ${{ runner.workspace }}/dl-cache
          key: dl-nx32u-${{ github.sha }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-nx32u-firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/*initramfs-recovery.itb
            openwrt/bin/targets/mediatek/filogic/*initramfs-kernel.bin
            openwrt/bin/targets/mediatek/filogic/*bl31-uboot.fip
            openwrt/bin/targets/mediatek/filogic/*preloader.bin
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failure
          path: |
            openwrt/logs/
            openwrt/tmp/
            openwrt/.config
            openwrt/bin/
          if-no-files-found: ignore
